name: Publish existing Windows EXE to GitHub Releases

on:
  push:
    branches:
      - feature/lightningcad-open-source-core
    paths:
      - .github/workflows/publish-existing-exe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish single-file EXE
    runs-on: ubuntu-latest
    steps:
      - name: Download tested Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41978439951 \
            --repo "$GITHUB_REPOSITORY" \
            --name LightningCAD-AI-EXE-Windows-x64 \
            --dir ./release
      - name: Verify a single Windows PE executable
        shell: bash
        run: |
          test -f release/LightningCAD-AI.exe
          test "$(find release -type f | wc -l)" -eq 1
          file release/LightningCAD-AI.exe
          file release/LightningCAD-AI.exe | grep -q 'PE32+ executable'
          test "$(stat -c%s release/LightningCAD-AI.exe)" -gt 10000000
          sha256sum release/LightningCAD-AI.exe
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.2.0-alpha.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/LightningCAD-AI.exe \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/LightningCAD-AI.exe \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LightningCAD-AI v0.2.0 Alpha · Windows 单文件 EXE" \
              --notes "Windows x64 独立 EXE（PyInstaller onefile）。不需要安装 Python。已通过 Windows CI 的 10 项自动化测试，但仍属草图识别 Alpha 版本，生成的工程图需要人工校核。构建来源：GitHub Actions Run 41978439951。" \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
