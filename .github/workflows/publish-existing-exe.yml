name: Publish OpenCADStudio-native Windows EXE

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish tested Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Find successful build for this source commit
        id: build
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-build.yml --branch feature/lightningcad-open-source-core --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Windows build found for commit $GITHUB_SHA."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download tested Windows executable
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh run download "\${{ steps.build.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name LightningCAD-AI-EXE-Windows-x64 \
            --dir ./release
      - name: Verify single Windows PE executable
        shell: bash
        run: |
          test -f release/LightningCAD-AI.exe
          test "$(find release -type f | wc -l)" -eq 1
          file release/LightningCAD-AI.exe | grep -q 'PE32+ executable'
          test "$(stat -c%s release/LightningCAD-AI.exe)" -gt 10000000
          sha256sum release/LightningCAD-AI.exe
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          TAG="v0.4.0-alpha.1"
          NOTES="Windows x64 single-file EXE. CAD output is generated by OpenCADStudio v2026.44 native automation API; OpenCADStudio must be installed separately. Includes topology-preserving line simplification, T-junction/intersection reconstruction, and manual review of coloured point markers. Pixel coordinates are not physical dimensions until a scale is confirmed."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/LightningCAD-AI.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/LightningCAD-AI.exe \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LightningCAD-AI v0.4.0 Alpha · OpenCADStudio native core" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
