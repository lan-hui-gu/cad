name: Publish LightningCAD-AI v0.5.0 automatic drawing EXE

on:
  push:
    branches:
      - feature/auto-cad-from-simplified-drawing
    paths:
      - .github/workflows/publish-existing-exe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish tested Windows EXE to GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Windows build of this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="feature/auto-cad-from-simplified-drawing"
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-build.yml --branch "$BRANCH" --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            echo "Waiting for the Windows EXE build for $GITHUB_SHA ($attempt/60)..."
            sleep 15
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Windows build found for commit $GITHUB_SHA."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download tested Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name LightningCAD-AI-EXE-Windows-x64 \
            --dir ./release
      - name: Verify executable and create checksum
        shell: bash
        run: |
          test -f release/LightningCAD-AI.exe
          test "$(find release -type f | wc -l)" -eq 1
          file release/LightningCAD-AI.exe | grep -q 'PE32+ executable'
          test "$(stat -c%s release/LightningCAD-AI.exe)" -gt 10000000
          cd release
          sha256sum LightningCAD-AI.exe | tee LightningCAD-AI.exe.sha256
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.5.0-alpha.1"
          TITLE="LightningCAD-AI v0.5.0 Alpha · simplified drawing to automatic CAD"
          NOTES="Windows x64 single-file EXE. Default workflow: import a hand sketch, recognize drawing primitives, generate a clean white-background simplified drawing, then automatically create native CAD entities in OpenCADStudio directly from that simplified geometry. No per-segment manual marking is required.\n\nThe simplified preview and CAD export share the same canonical geometry model. The build includes line, curve, triangle/circle symbol and OCR text conversion, plus cautious OCR-dimension scale estimation. OpenCADStudio v2026.44 must be installed separately.\n\nValidation: 26 Windows automated tests passed and the standalone EXE build succeeded. This is an Alpha release. Review the simplified preview and verify the resulting DWG in the target OpenCADStudio installation. Automatically inferred scale is an estimate, not a substitute for field measurement; if no reliable scale is available, pixel units are used."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/LightningCAD-AI.exe release/LightningCAD-AI.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/LightningCAD-AI.exe release/LightningCAD-AI.exe.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets