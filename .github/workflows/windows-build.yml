name: Windows single-file EXE

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build standalone Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Build one-file executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name LightningCAD-AI --collect-all rapidocr --collect-all onnxruntime --collect-all cv2 --collect-all shapely --collect-all pyclipper --collect-all omegaconf --add-data "config;config" run.py
      - name: Verify executable output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LightningCAD-AI.exe")) { throw "LightningCAD-AI.exe was not generated." }
          $exe = Get-Item "dist/LightningCAD-AI.exe"
          if ($exe.Length -lt 10000000) { throw "Executable unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Standalone EXE generated: $($exe.Length) bytes"
      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: LightningCAD-AI-EXE-Windows-x64
          path: dist/LightningCAD-AI.exe
          if-no-files-found: error
          retention-days: 30
