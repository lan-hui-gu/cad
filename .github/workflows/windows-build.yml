name: Windows build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Package Windows application
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Build onedir application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name LightningCAD-AI --collect-all rapidocr --collect-all onnxruntime --collect-all cv2 --collect-all shapely --collect-all pyclipper --collect-all omegaconf --add-data "config;config" run.py
      - name: Create distributable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LightningCAD-AI" -DestinationPath "LightningCAD-AI-Windows-x64.zip" -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LightningCAD-AI-Windows-x64
          path: LightningCAD-AI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
