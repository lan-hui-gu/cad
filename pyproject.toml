[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightningcad-ai"
version = "0.5.0"
description = "Local hand-sketched lightning protection inspection drawing recognition and DXF assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "LightningCAD-AI contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.18,<2",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "pyinstaller>=6.10,<7"]

[tool.setuptools.packages.find]
include = ["lightningcad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
